<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Quiz - Hackathon Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <div class="start-content">
                <h1>Tech Quiz Challenge</h1>
                <p class="subtitle">Test your tech knowledge in 10 questions</p>
                <div class="quiz-info">
                    <div class="info-item">
                        <span class="info-label">Questions</span>
                        <span class="info-value">10</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Time per Question</span>
                        <span class="info-value">45 sec</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Topic</span>
                        <span class="info-value">General Tech</span>
                    </div>
                </div>
                <button id="beginBtn" class="btn btn-primary">Begin Quiz</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="quiz-meta">
                    <span id="questionNumber" class="question-counter">Question 1 of 10</span>
                    <div id="timerDisplay" class="timer">
                        <span id="timerValue">45</span>s
                    </div>
                </div>
            </div>

            <div class="quiz-content">
                <h2 id="questionText" class="question-text">Loading question...</h2>
                
                <div id="optionsContainer" class="options-grid">
                    <!-- Options will be inserted here -->
                </div>

                <div id="feedbackSection" class="feedback-section" style="display: none;">
                    <p id="feedbackText" class="feedback-text"></p>
                    <button id="nextBtn" class="btn btn-secondary">Next Question</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="results-content">
                <h1>Quiz Complete!</h1>
                <div class="score-display">
                    <div class="score-circle">
                        <span id="finalScore" class="score-text">7/10</span>
                    </div>
                    <p id="scorePercentage" class="percentage">70%</p>
                </div>
                <p id="scoreMessage" class="score-message">Great effort!</p>
                
                <div class="results-actions">
                    <button id="reviewBtn" class="btn btn-secondary">Review Answers</button>
                    <button id="restartBtn" class="btn btn-primary">Restart Quiz</button>
                </div>
            </div>
        </div>

        <!-- Review Screen -->
        <div id="reviewScreen" class="screen">
            <div class="review-header">
                <h1>Review Your Answers</h1>
                <p id="reviewScore" class="review-score">Score: 7/10 (70%)</p>
            </div>

            <div id="reviewContainer" class="review-container">
                <!-- Review items will be inserted here -->
            </div>

            <div class="review-actions">
                <button id="backBtn" class="btn btn-secondary">Back to Results</button>
                <button id="restartFromReviewBtn" class="btn btn-primary">Start New Quiz</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
